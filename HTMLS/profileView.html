<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile View</title>
    <link rel="stylesheet" href="../Styles/themeRoot.css">
<link rel="stylesheet" href="../Styles/profileView.css">

    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body>
    <!-- Profile Container -->
    <div class="profile-container">
    <!-- Back Button inside container -->
    <button class="back-btn">
        <i class="fi fi-rr-arrow-left"></i>
    </button>

    <div class="profile-header">
        <div class="profileImg-container"><i class="fi fi-rr-user"></i></div>
        <div class="profileInfo">
            <h2>Name <i class="fi fi-rr-circle-a"></i></h2>
            <h6>@username</h6>
            <div class="clubs">
                <a href="#"><i class="fi fi-rr-dice-alt"></i> Game</a>
                <a href="#"><i class="fi fi-rr-music-alt"></i> Music</a>
                <a href="#"><i class="fi fi-rr-chess-knight-alt"></i> Chess</a>
            </div>
        </div>
    </div>

    <div class="bio">
        Lorem ipsum dolor sit amet, quibusdam repellendus totam deserunt ullam quam, libero aliquid nobis dignissimos assumenda, inventore voluptate obcaecati optio magnam aliquam, sed quis.
    </div>

    <div class="contact-info">
        <h5>Contact Information</h5>
        <a href="mailto:someone@gmail.com">example@gmail.com</a>
        <p>+9591234567</p>
    </div>
</div>
<script src="../JS/theme.js"></script>
<script src="../JS/profileView.js"></script>
</body>
</html>
